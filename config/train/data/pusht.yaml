dataset:
  # A window of W frames yields one timestep, so covering history_size + num_preds timesteps
  # needs W-1 extra frames on the front. W=1 collapses this to the original expression.
  num_steps: ${eval:'${num_preds} + ${history_size} + ${window_size} - 1'}
  frameskip: 5
  name: pusht_expert_train.lance
  keys_to_load:
    - pixels
    - action
    - proprio
    - state
  keys_to_cache:
    - action
    - proprio
    - state