defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 4

# Frames encoded jointly per timestep. 10 * 196 = 1,960 tokens, the largest multiple of a
# 196-token frame that still fits under the scan's 2,048 chunk boundary -- 11 frames spills to
# a 4,096 chunk and Jamba loses to the matched ViT. See MULTIFRAME_PLAN.md.
# window_size: 1 restores the original per-frame encoder exactly.
window_size: 10
window_stride: 1

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  # Measured on an A100-40GB (mfprobe, 2026-07-29): batch 4 -> 18.8 GB, batch 8 -> 37.4 GB,
  # batch 16 -> OOM. Throughput is FLAT across that range (13.3 vs 13.0 samp/s) because 20
  # windows of 1,960 tokens in both scan directions already saturates the GPU -- a bigger
  # batch buys memory pressure and nothing else. So take the small one and accumulate to keep
  # the effective batch, and therefore the LR, where the paper had them.
  accumulate_grad_batches: 32

loader:
  batch_size: 4
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
