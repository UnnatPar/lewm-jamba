defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 4

# Frames encoded jointly per timestep. 20 * 196 = 3,920 tokens.
#
# This is PAST THE CROSSOVER: measured 1.10x a parameter-matched ViT, where 10 frames (1,960
# tokens) is only 0.89x. The crossover sits at ~3,300 tokens (17 frames) and 3,920 is the next
# chunk-efficient window after 1,960 -- 3,920/4,096 = 95.7%, the same efficiency as 1,960/2,048,
# which is why 12 or 16 frames are worse choices despite being longer than 10.
#
# It is also not more expensive than the original: 0.47 hr/epoch at batch 4 versus 0.53 for the
# unoptimised 10-frame config, with double the temporal context.
#
# window_size: 10 is the cheap alternative at 0.25 hr/epoch, but loses to the matched ViT.
# window_size: 1 restores the original per-frame encoder exactly.
window_size: 20
window_stride: 1

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  # Re-measured after the encoder optimisation (mfprobe2, A100-40GB, window 20): batch 4 gives
  # 14.85 samp/s at 15.4 GB, and samples/s is flat from batch 2 to 6 (14.20 / 14.66 / 14.85 /
  # 14.67) -- the card is saturated, so a bigger batch buys memory pressure and nothing else.
  # Accumulate to hold the effective batch, and therefore the LR, where the paper had them.
  accumulate_grad_batches: 32

loader:
  batch_size: 4
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
